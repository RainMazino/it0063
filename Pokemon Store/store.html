<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="store.css">
    <script src="store.js"></script>
</head>
<body class="bg-dark text-white">
    <div class="container py-5">
        <div class="featured-container">
            <h2 class="fw-bold featured-title">FEATURED</h2>
            <div class="featured-section text-white p-5 rounded d-flex justify-content-between align-items-start">
                <div class="featured-content">
                    <h3 class="fw-bold">Pokémon GO Fest 2025: Global Ticket</h3>
                    <p>Can only be purchased 1 time.</p>
                    <button class="btn btn-warning mt-3">₱439.00</button>
                </div>
            
                <div class="featured-image-container text-end">
                    <img src="Featured\Featured.webp" alt="Gift Box" class="featured-img">
                    <div class="featured-badges mt-3">
                        <div class="featured-badge-group me-3">
                            <img src="Featured\Featured 1.webp" class="featured-badge-img" alt="Raid Pass">
                            <div class="featured-number-badge">x3</div>
                        </div>
                        <div class="featured-badge-group me-3">
                            <img src="Featured\Featured 2.webp" class="featured-badge-img" alt="Incense">
                            <div class="featured-number-badge">x5</div>
                        </div>
                        <div class="featured-badge-group me-3">
                            <img src="Featured\Featured 3.webp" class="featured-badge-img" alt="Star Piece">
                            <div class="featured-number-badge">x10</div>
                        </div>
                        <div class="featured-badge-group">
                            <img src="Featured\Featured 4.webp" class="featured-badge-img" alt="Lure Module">
                            <div class="featured-number-badge">x2</div>
                        </div>
                    </div>
                </div>
            </div>
        
        <div class="d-flex justify-content-center gap-3 mb-4 mt-4">
            <button id="btn-item-boxes" onclick="showSection('item-boxes')" class="btn toggle-btn">ITEM BOXES</button>
            <button id="btn-pokecoins" onclick="showSection('pokecoins')" class="btn toggle-btn active">POKÉCOINS</button>
        </div>
        
        <div id="item-boxes" class="d-none">
            <div class="row row-cols-1 row-cols-md-4 g-4 py-4" id="item-box-list"></div>
        </div>
        
        <div id="pokecoins">
            <div class="row row-cols-1 row-cols-md-4 g-4 py-4" id="pokecoin-list"></div>
        </div>
    </div>
    <div class="container py-4">
        <div class="daily-bundles">
            <h2 class="fw-bold text-white mb-3">Daily Bundles</h2>
            <div class="bundles-card bg-white rounded-3 p-4 mx-auto">
                <img src="Daily Bundle\Daily Bundles.webp" 
                     class="bundle-item-img" 
                     alt="Mystery Bundle"
                     loading="lazy">
                <h4 class="fw-bold text-dark mt-3">Mystery Boxes</h4>
                <p class="text-muted small mb-4">3 Daily Bundles</p>
                <button class="btn bundle-btn">Sign in to view</button>
            </div>
        </div>
    </div>
</body>
</html>

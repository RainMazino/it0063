<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Guide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Restaurant.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <!-- Navigation bar content -->
    </nav>

    <div class="container">
        <h1 class="title">Restaurant Guide</h1>
        <p class="subtitle">Discover the best restaurants around the world</p>

        <div class="row">
            <div class="col-md-4">
                <div class="card" onclick="showPopup('adobo')">
                    <img src="adobo.jpg" alt="Adobo">
                    <div class="card-body">
                        <h5 class="card-title">ADOBO</h5>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card" onclick="showPopup('kaiseki')">
                    <img src="kaiseki.jpg" alt="Kaiseki">
                    <div class="card-body">
                        <h5 class="card-title">KAISEKI</h5>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card" onclick="showPopup('beefwellington')">
                    <img src="beef wellington.jpg" alt="Beef Wellington">
                    <div class="card-body">
                        <h5 class="card-title">BEEF WELLINGTON</h5>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="popup" class="popup-card">
        <span class="close-btn" onclick="closePopup()">×</span>
        <h2 id="popup-title"></h2>
        <p id="popup-description"></p>
        <p id="popup-info"></p>
        <img id="popup-image" src="" alt="Restaurant Image">
    </div>

    <script src="Restaurant.js"></script>
</body>
</html>
